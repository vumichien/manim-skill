name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Add uv to PATH
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: System libs for cairo/pango (manim native deps)
        run: sudo apt-get update -y && sudo apt-get install -y libcairo2-dev libpango1.0-dev pkg-config

      - name: Bootstrap venv + install deps
        run: bash scripts/install.sh --skip-latex
        env:
          VENV_PATH: .venv

      - name: Lint
        run: .venv/bin/ruff check .

      - name: Tests (excluding live-manim)
        run: .venv/bin/pytest tests/ -v --tb=short -m "not requires_manim and not slow"

      - name: Smoke render (one tiny scene at -ql)
        run: |
          .venv/bin/python -m manim render -ql --media_dir /tmp/smoke \
            tests/fixtures/hello_scene.py HelloScene --dry_run

      - name: Smoke render sample 01 + concat-xfade
        run: |
          cd samples/01-pythagoras-2d
          ../../.venv/bin/python -m manim render -ql --media_dir /tmp/sample01 scene.py Scene01
          ../../.venv/bin/python -m manim render -ql --media_dir /tmp/sample01 scene.py Scene02
          ../../.venv/bin/python -m manim render -ql --media_dir /tmp/sample01 scene.py Scene03
          ../../.venv/bin/python ../../scripts/concat-xfade.py \
            --inputs /tmp/sample01/videos/scene/480p15/Scene01.mp4 \
                     /tmp/sample01/videos/scene/480p15/Scene02.mp4 \
                     /tmp/sample01/videos/scene/480p15/Scene03.mp4 \
            --durations 7.0 7.0 4.0 \
            --transition-s 0.7 \
            --out /tmp/sample01/video.mp4

      - name: Plugin manifest sanity
        run: |
          .venv/bin/python -m json.tool .claude-plugin/marketplace.json > /dev/null
          .venv/bin/python -m json.tool .claude-plugin/plugin.json > /dev/null
