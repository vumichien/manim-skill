scenes:
  - id: scene_01
    title: "Cube rotates around vertical axis"
    beat: "ThreeDAxes appear, then a cube fades in and rotates 360 degrees around UP."
    duration_s: 9
    scene_class: ThreeDScene
    show_title_card: false
    mobjects:
      - type: ThreeDAxes
        name: axes
        kwargs: { x_range: [-3, 3], y_range: [-3, 3], z_range: [-3, 3] }
      - type: Cube
        name: cube
        kwargs: { side_length: 2, fill_opacity: 0.6, color: "#4ADEDC" }
    animations:
      - { target: axes, anim: Create, duration: 1.5 }
      - { target: cube, anim: FadeIn, duration: 1 }
      - { target: cube, anim: Rotate, duration: 5, kwargs: { angle: 6.2831853, run_time: 5 } }
    voiceover_text: "A 3D coordinate system appears. A translucent cube fades in and rotates a full turn around the vertical axis."
    notes: "Camera oriented at phi=75deg, theta=30deg before construct. PI*2 ~ 6.2831853. Title card disabled because ThreeDScene camera quirks would distort it. Header added via add_fixed_in_frame_mobjects."
