meta:
  title: "Quadratic plot"
  topic: "Plot y = x^2 on labeled axes"
  source: { kind: idea, ref: null }
  quality: medium
  voice: null
  total_duration_s: 8
  created_at: "2026-05-07T00:00:00Z"
