meta:
  schema_version: "0.2.0"
  title: "Quadratic plot"
  topic: "Plot y = x squared on labeled axes"
  source: { kind: idea, ref: null }
  quality: medium
  voice: null
  total_duration_s: 9
  transition_s: 0.7
  palette:
    primary: "#4ADEDC"
    accent:  "#8B5CF6"
    warn:    "#F5E6C8"
    bg:      "#0F1B2D"
  show_progress: true
  created_at: "2026-05-07T00:00:00Z"
  manim_version: "0.20.1"

scenes:
  - id: scene_01
    title: "Axes and parabola"
    beat: "Axes appear, then y = x squared is drawn from left to right with a label."
    duration_s: 9
    scene_class: Scene
    show_title_card: true
    mobjects:
      - type: Axes
        name: axes
        kwargs: { x_range: [-3, 3, 1], y_range: [0, 9, 1], x_length: 6, y_length: 4 }
      - type: ParametricFunction
        name: parabola
        kwargs: { color: "#8B5CF6" }
      - type: Text
        name: label
        content: "y = x^2"
        position: UR
        kwargs: { font_size: 36 }
    animations:
      - { target: axes, anim: Create, duration: 1.5 }
      - { target: parabola, anim: Create, duration: 4 }
      - { target: label, anim: Write, duration: 1.5 }
    voiceover_text: "Plot the parabola y equals x squared. Axes appear first, then the curve sweeps from left to right."
    notes: "ParametricFunction is built via axes.plot(lambda x: x**2, x_range=[-3, 3]) at scene-emit time. Body shifted DOWN 0.5 to keep within y in [-3, 3] under header."
