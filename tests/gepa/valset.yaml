# GEPA valset — hands-off regression guard. Do NOT edit without bumping
# .valset.sha256 (phase 08 CI gate) and applying the `samples-valset-update`
# PR label.
# Each entry points at a canonical sample storyboard and scene file. The
# regression guard re-renders these against the current agent prompts and
# fails if any sample no longer produces a valid video.

