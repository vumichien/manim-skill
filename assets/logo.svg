<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="manim-skill logo">
  <title>manim-skill</title>
  <!-- Dark navy full-bleed background -->
  <rect width="512" height="512" rx="80" ry="80" fill="#0B1B3B"/>

  <!-- Motion-blur trails (3 stacked, decreasing opacity right-to-left, cyan tint) -->
  <g stroke="#4ADEDC" stroke-linecap="round" fill="none">
    <line x1="80"  y1="180" x2="200" y2="180" stroke-width="10" opacity="0.18"/>
    <line x1="100" y1="260" x2="220" y2="260" stroke-width="12" opacity="0.32"/>
    <line x1="80"  y1="340" x2="200" y2="340" stroke-width="10" opacity="0.45"/>
  </g>

  <!-- Stylized integral glyph: ∫ in white, hand-tuned bezier so it reads as
       an integral at any size. Drawn around centre x=300. -->
  <path d="M 300 90
           C 250 90, 230 130, 230 180
           L 230 360
           C 230 410, 250 440, 200 440
           C 175 440, 165 425, 165 410"
        stroke="#FFFFFF" stroke-width="32" stroke-linecap="round"
        fill="none"/>

  <!-- Subtle bottom serif blob to anchor the integral -->
  <circle cx="170" cy="412" r="6" fill="#FFFFFF"/>
  <!-- Top serif blob -->
  <circle cx="295" cy="92"  r="6" fill="#FFFFFF"/>
</svg>
