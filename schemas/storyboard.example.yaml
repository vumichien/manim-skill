# Canonical reference storyboard for the Pythagoras-visual-proof sample.
# Schema v0.2.0 contract between manim-planner and manim-implementer.
# Validates against schemas/storyboard.schema.json (Draft 2020-12).
meta:
  schema_version: "0.2.0"
  title: "Pythagoras' Theorem - Visual Proof"
  topic: "Pythagorean theorem visual rearrangement proof"
  source:
    kind: math
    ref: null
  quality: high
  voice: gtts
  total_duration_s: 24
  transition_s: 0.7
  palette:
    primary: "#4ADEDC"
    accent:  "#8B5CF6"
    warn:    "#F5E6C8"
    bg:      "#0F1B2D"
  show_progress: true
  created_at: "2026-05-07T00:00:00Z"
  manim_version: "0.20.1"

scenes:
  - id: scene_01
    title: "Set up the right triangle"
    beat: "Draw a right triangle with legs a, b and hypotenuse c. Label each side."
    duration_s: 8
    scene_class: Scene
    show_title_card: true
    mobjects:
      - type: Polygon
        name: triangle
        kwargs: { color: "#4ADEDC", stroke_width: 4 }
      - type: Text
        name: label_a
        content: "a"
        position: DOWN
      - type: Text
        name: label_b
        content: "b"
        position: LEFT
      - type: Text
        name: label_c
        content: "c"
        position: UR
    animations:
      - { target: triangle, anim: Create, duration: 2 }
      - { target: "VGroup(label_a, label_b, label_c)", anim: Write, duration: 1.5 }
    voiceover_text: "Start with a right triangle. The two legs are labeled a and b, and the hypotenuse is c."
    notes: "Triangle vertices computed at runtime: (0,0), (3,0), (0,4). Labels offset 0.3 outward."

  - id: scene_02
    title: "Rearrange into the equality"
    beat: "Duplicate triangle 3x; arrange 4 copies into a square of side a+b. Show area = c-squared in the middle."
    duration_s: 10
    scene_class: Scene
    show_title_card: true
    mobjects:
      - type: VGroup
        name: four_triangles
        kwargs: { }
      - type: Square
        name: inner_square
        kwargs: { side_length: 2.5, color: "#8B5CF6" }
      - type: MathTex
        name: c_squared
        content: "c^2"
        position: ORIGIN
    animations:
      - { target: four_triangles, anim: LaggedStart, duration: 3, kwargs: { lag_ratio: 0.4 } }
      - { target: inner_square, anim: DrawBorderThenFill, duration: 2 }
      - { target: c_squared, anim: Write, duration: 2 }
    voiceover_text: "Now copy the triangle four times and arrange them inside a square of side a plus b. The empty middle has area c squared."
    notes: "MathTex requires LaTeX; if absent, fall back to Text('c^2'). Implementer decides."

  - id: scene_03
    title: "Conclude a-squared plus b-squared equals c-squared"
    beat: "Slide two triangles so the inner shapes form two squares of areas a-squared and b-squared. Show the equation."
    duration_s: 6
    scene_class: Scene
    show_title_card: false
    mobjects:
      - type: MathTex
        name: equation
        content: "a^2 + b^2 = c^2"
        position: UP
    animations:
      - { target: equation, anim: Write, duration: 2.5 }
      - { target: equation, anim: Indicate, duration: 1.5 }
    voiceover_text: "Slide two triangles to form two smaller squares with areas a squared and b squared. Their sum equals c squared."
    notes: "Final hold of 1s for poster frame."
